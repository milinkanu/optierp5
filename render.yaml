services:
  - type: web
    name: erp-backend
    runtime: python
    plan: starter
    rootDir: erp-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FINOPS_USE_DATABASE
        value: "true"
      - key: DEV_ALLOW_ALL_ORIGINS
        value: "false"
      # Set these in Render Dashboard (don’t commit secrets):
      # - DATABASE_URL
      # - JWT_SECRET
      # - JWT_ALGORITHM
      # - JWT_EXPIRATION_MINUTES
