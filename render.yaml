databases:
  - name: finops-db
    plan: free
    databaseName: finops
    user: finops

services:
  - type: web
    name: erp-backend
    runtime: python
    plan: starter
    rootDir: erp-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FINOPS_USE_DATABASE
        value: "true"
      - key: DEV_ALLOW_ALL_ORIGINS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: finops-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: JWT_EXPIRATION_MINUTES
        value: "60"
      - key: ALLOWED_ORIGINS
        value: "https://your-vercel-domain.vercel.app"
        sync: false
